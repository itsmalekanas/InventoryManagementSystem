name: Build Inventory Management System

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Read application version
        id: version
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          mkdir -p "dist/Inventory Management System"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui" -o "dist/Inventory Management System/Inventory Management System.exe" .
          cd dist && zip -r InventoryManagementSystem-windows.zip "Inventory Management System"
      - uses: actions/upload-artifact@v4
        with:
          name: InventoryManagementSystem-windows
          path: dist/Inventory Management System
      - name: Move the "latest" tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish the "latest" download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Inventory Management System ${{ steps.version.outputs.value }} — Early release
          body: Early development release. Download InventoryManagementSystem-windows.zip, unzip it anywhere (for example a USB stick) and run Inventory Management System.exe.
          files: dist/InventoryManagementSystem-windows.zip
          prerelease: true
          make_latest: false
