name: Build Inventory Management System

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read application version
        id: version
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$version"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Test
        run: go test ./...
      - name: Go static checks
        run: go vet ./...
      - name: Check browser scripts
        run: |
          for file in web/*.js; do node --check "$file"; done
      - name: JavaScript regression tests
        run: node --test tests/*.test.cjs
      - name: Build
        run: |
          go run github.com/akavel/rsrc@v0.10.2 -ico assets/app.ico -o rsrc_windows_amd64.syso
          mkdir -p "dist/Inventory Management System"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui" -o "dist/Inventory Management System/Inventory Management System.exe" .
          cd dist && zip -r InventoryManagementSystem-windows.zip "Inventory Management System"
      - uses: actions/upload-artifact@v4
        with:
          name: InventoryManagementSystem-windows
          path: dist/Inventory Management System
      - name: Publish versioned download
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Inventory Management System ${{ steps.version.outputs.value }} — Early release
          body: Early development release. Download InventoryManagementSystem-windows.zip, unzip it anywhere (for example a USB stick) and run Inventory Management System.exe.
          files: dist/InventoryManagementSystem-windows.zip
          prerelease: false
          make_latest: true
